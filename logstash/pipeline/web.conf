# Atelier 2 : logs d'accès du site de recrutement -> data stream logs-web-default.
input {
  file {
    path => "/data/access.log"
    mode => "read"
    sincedb_path => "/dev/null"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/web_lus.log"
  }
}

filter {
  # TODO 1 : découper la ligne au format Apache "combined" en champs ECS
  #          (source.address, http.request.method, url.original, http.version,
  #          http.response.status_code (entier), http.response.body.bytes,
  #          http.request.referrer, user_agent.original) + champ texte "timestamp".
  #          Ligne non reconnue -> tag _grokparsefailure.
  grok {
    match => { "message" => "%{COMBINEDAPACHELOG}" }
  }

  # TODO 2 : dater l'événement avec l'heure de la requête (et non l'heure de lecture),
  #          mois en anglais ("Sep") -> locale "en" ; le champ texte devient inutile.
  date {
    match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
    locale => "en"
    remove_field => ["timestamp"]
  }

  # TODO 3 : décomposer le navigateur (user_agent.name, .version, .os.name, .device.name).
  useragent {
    source => "[user_agent][original]"
  }

  # TODO 4 : pour les pages d'offre (/offres/OFF-xxxxx et /offres/OFF-xxxxx/postuler),
  #          extraire l'identifiant de l'offre dans labels.offre_id, avec un motif personnalisé.
  if [url][original] =~ /^\/offres\/OFF-/ {
    grok {
      pattern_definitions => { "OFFRE_ID" => "OFF-[0-9]{5}" }
      match => { "[url][original]" => "^/offres/%{OFFRE_ID:[labels][offre_id]}" }
    }
  }

  # TODO 5 : ne garder la ligne brute (event.original) que si l'analyse a échoué,
  #          pour pouvoir diagnostiquer ; sinon elle double inutilement le stockage.
  if "_grokparsefailure" not in [tags] {
    mutate { remove_field => ["[event][original]"] }
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOSTS}"]
    user => "${ES_USER}"
    password => "${ES_PASSWORD}"
    # TODO 6 : écrire dans le data stream logs-web-default (<type>-<dataset>-<namespace>) ;
    #          le modèle intégré logs-*-* le crée avec des mappings ECS et le mode logsdb.
    data_stream => "true"
    data_stream_type => "logs"
    data_stream_dataset => "web"
    data_stream_namespace => "default"
  }
}
