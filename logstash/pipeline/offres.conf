# Atelier 1 : recharger data/offres.ndjson dans l'index "offres" du TP.
input {
  file {
    path => "/data/offres.ndjson"
    # TODO 1 : lecture complète, une seule fois (pas de suivi continu de la fin du fichier)
    mode => "read"
    # TODO 2 : une ligne = un objet JSON -> les champs de l'objet deviennent ceux de l'événement
    codec => "json"
    # TODO 3 : pas de mémoire de position (labo : fichier relu à chaque démarrage)
    sincedb_path => "/dev/null"
    # TODO 4 : ne PAS supprimer le fichier après lecture (défaut "delete"), noter son nom
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/offres_lus.log"
  }
}

filter {
  # TODO 6 (exercice 1.3) : le mapping "dynamic": "strict" de l'index "offres" refuse
  # tout champ non déclaré. On retire les métadonnées ajoutées par Logstash
  # (@version, @timestamp) et par l'entrée file en mode ECS (host, log, event) :
  # le document indexé redevient identique à la ligne du fichier.
  mutate {
    remove_field => ["@version", "@timestamp", "host", "log", "event"]
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOSTS}"]
    user => "${ES_USER}"
    password => "${ES_PASSWORD}"
    # TODO 5 : index "offres", _id métier (idempotence), action index,
    #          pas de data stream, pas de template (le mapping existe déjà)
    index => "offres"
    document_id => "%{id}"
    action => "index"
    data_stream => "false"
    manage_template => false
  }
}
