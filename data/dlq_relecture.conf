# Exercice 2.2 — relire la dead letter queue du pipeline "offres" (Logstash éphémère).
# Lancement (dans le conteneur, où ./data est monté en /data) :
#   docker compose exec logstash logstash --path.data /tmp/dlq -f /data/dlq_relecture.conf
input {
  dead_letter_queue {
    path => "/usr/share/logstash/data/dead_letter_queue"
    pipeline_id => "offres"
    commit_offsets => false   # ne pas marquer comme lus : on peut relire autant de fois que voulu
  }
}

output {
  stdout { codec => rubydebug { metadata => true } }   # affiche aussi [@metadata][dead_letter_queue]
}
